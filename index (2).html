async function boot(){
  if(!sb){$("#app").innerHTML='<div class="login card">'+(typeof supabase==="undefined"?"Un composant nécessaire n’a pas pu se charger. Votre réseau ou une extension le bloque. Essayez un autre navigateur ou une autre connexion.":"Renseignez SB_URL et SB_KEY en haut du fichier index.html.")+'</div>';return}

  if(!session){login();return}

  const{data}=await sb.from("profils").select("*").eq("id",me.id).maybeSingle();
  if(!data||!data.actif){$("#app").innerHTML='<div class="login card"><h2>Inscription en attente de validation</h2><p>Votre demande est bien reçue. Un administrateur doit valider votre rôle. Revenez plus tard avec le même email et le même mot de passe.</p><button class="b" data-a="out">Se déconnecter</button></div>';return}
  pr=data;pg=["benevole","psychologue"].includes(pr.role)?"wa":MENU[pr.role][0][0];await load();
  let tm;const plan=()=>{clearTimeout(tm);tm=setTimeout(async()=>{const a=document.activeElement;if(a&&/^(TEXTAREA|INPUT)$/.test(a.tagName)&&a.value)return;await load();if(sel&&pg=="wa")loadDet(true)},700)};

  setInterval(plan,20000);
}
function login(m){$("#app").innerHTML=m=="ins"?`<div class="login card"><h1>Créer un compte</h1><div class="sub">Réservé aux membres de l’ASMD. Un administrateur valide votre rôle avant tout accès.</div><label>Nom et prénom</label><input id="sn" autocomplete="name"><label>Téléphone</label><input id="st" type="tel"><label>Vous êtes</label><select id="sr"><option value="benevole">Bénévole</option><option value="psychologue">Psychologue</option><option value="autre">Autre fonction</option></select><label>Email</label><input id="se" type="email" autocomplete="username"><label>Mot de passe (8 caractères minimum)</label><input id="sp" type="password" autocomplete="new-password"><button class="b p" data-a="ins" style="margin-top:8px">Envoyer ma demande</button><button class="b" data-a="lg">Retour à la connexion</button><div id="er" class="sub err"></div></div>`:`<div class="login card"><h1>Séhótché</h1><div class="sub">ASMD · Brisons le silence. Restaurons la dignité.</div><label>Email</label><input id="em" type="email" autocomplete="username"><label>Mot de passe</label><input id="pw" type="password" autocomplete="current-password"><button class="b p" data-a="in" style="margin-top:8px">Se connecter</button><button class="b" data-a="lins" style="margin-top:8px">Créer un compte</button><div id="er" class="sub err"></div><button class="b" data-a="tst" style="margin-top:8px">Tester la connexion</button><div id="ts" class="sub"></div></div>`}

async function load(){

    const q=(t,s,o)=>sb.from(t).select(s).order(o,{ascending:false});
    const[d,o,u,r]=await Promise.all([q("demandes","*,beneficiaires(code,pseudo,telephone,email,commune,motif,tranche_age,consentement),benevole:profils!benevole_id(nom),psy:profils!psychologue_id(nom)","maj_le"),q("orientations","*,demandes(code),psy:profils!psychologue_id(nom)","demandee_le"),q("urgences","*,demandes(code)","cree_le"),q("rendez_vous","*,demandes(code)","debut")]);

    S.mode=((await sb.from("parametres").select("valeur").eq("cle","whatsapp_mode").maybeSingle()).data||{}).valeur||"application";

const P={
dash(){

    b=`<div class="card"><h2>Orientations à surveiller</h2>${P.oriT(ap)}</div>`}
  return`${P.pb()}${isAdm()&&S.insc.length?`<div class="card"><b>${S.insc.length} inscription(s) en attente.</b> <button class="b p" data-a="go" data-v="eq">Voir</button></div>`:""}<div class="kp">${k.map(x=>`<div class="${x[2]?"r":""}"><b>${x[1]}</b>${x[0]}</div>`).join("")}</div>${b}`},
pb(){const n=new Date(),en=S.perm.filter(x=>new Date(x.debut)<=n&&new Date(x.fin)>=n);return en.length?`<div class="card">Psychologue de permanence : ${en.map(x=>e(S.nom[x.psychologue_id]||"")).join(", ")}</div>`:`<div class="card"><span class="err">Aucun psychologue de permanence en ce moment.</span> ${isC()||isAll()?'<button class="b p" data-a="go" data-v="perm">Planifier</button>':""}</div>`},
