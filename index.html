.login{max-width:360px;margin:12vh auto}.err{color:var(--red)}
@media(max-width:860px){.app{grid-template-columns:1fr}nav{display:flex;overflow-x:auto;gap:4px;align-items:center}nav .brand{display:none}nav button{white-space:nowrap;width:auto}.gi,.g2{grid-template-columns:1fr}}

  if(!sb){$("#app").innerHTML='<div class="login card">'+(typeof supabase==="undefined"?"Un composant nécessaire n’a pas pu se charger. Votre réseau ou une extension le bloque. Essayez un autre navigateur ou une autre connexion.":"Renseignez SB_URL et SB_KEY en haut du fichier index.html.")+'</div>';return}

  if(!data||!data.actif){$("#app").innerHTML='<div class="login card"><h2>Inscription en attente de validation</h2><p>Votre demande est bien reçue. Un administrateur doit valider votre rôle. Revenez plus tard avec le même email et le même mot de passe.</p><button class="b" data-a="out">Se déconnecter</button></div>';return}

async function load(){
  const pf=await sb.from("profils").select("id,nom,role,actif").order("nom");S.profs=pf.data||[];S.nom={};S.profs.forEach(p=>S.nom[p.id]=p.nom);
  S.psy=S.profs.filter(p=>p.actif&&["psychologue","resp_sante_mentale"].includes(p.role));

    const q=(t,s,o)=>sb.from(t).select(s).order(o,{ascending:false});

const P={
dash(){
  const ouv=S.dem.filter(d=>d.statut!="cloture"),ap=S.ori.filter(x=>!x.contact_effectif_le&&!x.refusee_le),mon=S.dem.filter(d=>d.benevole_id==me.id);

  else{k=[["Dossiers ouverts",ouv.length],["Urgences ouvertes",ur,1],["Orientations en attente",ap.filter(x=>!x.delai_depasse).length],["Délais de 24 h dépassés",S.ori.filter(x=>x.delai_depasse).length,1],["Rendez-vous à venir",S.rdv.filter(r=>new Date(r.debut)>new Date()&&!["annule","realise"].includes(r.statut)).length],["Dossiers clôturés",S.dem.length-ouv.length]];
    b=`<div class="card"><h2>Orientations à surveiller</h2>${P.oriT(ap)}</div>`}

pb(){const n=new Date(),en=S.perm.filter(x=>new Date(x.debut)<=n&&new Date(x.fin)>=n);return en.length?`<div class="card">Psychologue de permanence : ${en.map(x=>e(S.nom[x.psychologue_id]||"")).join(", ")}</div>`:`<div class="card"><span class="err">Aucun psychologue de permanence en ce moment.</span> ${isC()||isAll()?'<button class="b p" data-a="go" data-v="perm">Planifier</button>':""}</div>`},
perm(){const self=pr.role=="psychologue",n=new Date(),en=S.perm.filter(x=>new Date(x.debut)<=n&&new Date(x.fin)>=n),l=self?S.perm.filter(x=>x.psychologue_id==me.id):S.perm,fm2=t=>new Date(t).toLocaleString("fr-FR",{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
  return`<div class="card"><h2>${en.length?"De permanence maintenant : "+en.map(x=>e(S.nom[x.psychologue_id]||"")).join(", "):"Aucun psychologue de permanence en ce moment"}</h2><p class="sub">Quand le délai de 24 h est dépassé, le dossier part vers le psychologue de permanence le moins chargé. Chaque psychologue planifie ses propres créneaux.</p></div>
<div class="card"><h2>${self?"Mes créneaux à venir":"Créneaux à venir"}</h2>${tb(["Psychologue","Début","Fin",""],l.map(x=>[e(S.nom[x.psychologue_id]||""),fm2(x.debut),fm2(x.fin),x.psychologue_id==me.id||isAll()?`<button class="b d" data-a="pdl" data-v="${x.id}">Supprimer</button>`:""]))}</div>
<div class="card"><h2>Ajouter un créneau de permanence</h2><div class="g2">${self?"":`<div><label>Psychologue</label><select id="pp">${S.psy.map(p=>`<option value="${p.id}">${e(p.nom)}</option>`).join("")}</select></div>`}<div><label>Début</label><input id="pd" type="datetime-local"></div><div><label>Fin</label><input id="pf" type="datetime-local"></div><div><label>Répéter chaque semaine pendant</label><select id="pw">${[1,2,3,4,6,8,12].map(k=>`<option value="${k}">${k==1?"1 fois (créneau unique)":k+" semaines"}</option>`).join("")}</select></div></div><button class="b p" data-a="pa">Enregistrer</button></div>`},
dl(l,t){return tb(["Dossier","Pseudo","Statut","Dernier message",""],l.map(d=>[e(d.beneficiaires?.code||d.code),e(d.beneficiaires?.pseudo||"—"),tg(ST[d.statut]),fm(d.dernier_message_recu),t?`<button class="b p" data-a="pc" data-v="${d.id}">Prendre en charge</button>`:`<button class="b" data-a="op" data-v="${d.id}">Ouvrir</button>`]))},

  l.forEach(r=>{const k=new Date(r.debut).toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});(g[k]=g[k]||[]).push(r)});
  return Object.keys(g).length?Object.entries(g).map(([k,a])=>`<div class="card"><h2>${e(k)}</h2>${a.map(r=>`<div class="log"><b>${new Date(r.debut).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})}</b> · ${e(r.demandes?.code)} · ${r.type=="distance"?"À distance":"Présentiel"} ${tg(r.statut.replaceAll("_"," "))}</div>`).join("")}</div>`).join(""):'<div class="card sub">Aucun rendez-vous à venir.</div>'},

urg(){return`<div class="card">${tb(["Dossier","Niveau","Description","Statut","Déclarée","Actions"],S.urg.map(u=>[e(u.demandes?.code),tg(u.niveau,"r"),e(u.description),tg(u.statut.replaceAll("_"," "),"r"),fm(u.cree_le),isC()||isAll()?[["en_charge","Prendre en charge"],["escaladee","Escalader"],["resolue","Résolue"]].map(([s,l])=>`<button class="b" data-a="us" data-v="${u.id}|${s}">${l}</button>`).join(""):""]))}</div><p class="sub">Circuit prioritaire : une urgence ne dépend pas du délai de 24 h.</p>`},

eq(){return`${S.insc.length?`<div class="card"><h2>Demandes d’inscription (${S.insc.length})</h2>${tb(["Nom","Email","Téléphone","Souhait","Rôle à donner",""],S.insc.map(i=>[e(i.nom),e(i.email),e(i.telephone||"—"),e(i.role_souhaite||"—"),`<select id="ir${i.id}">${Object.entries(ROLES).map(([k,v])=>`<option value="${k}"${k==i.role_souhaite?" selected":""}>${v}</option>`).join("")}</select>`,`<button class="b p" data-a="iv" data-v="${i.id}">Valider</button><button class="b d" data-a="ir" data-v="${i.id}">Refuser</button>`]))}</div>`:""}<div class="card">${tb(["Nom","Rôle","Statut",""],S.profs.map(p=>[e(p.nom),e(ROLES[p.role]),tg(p.actif?"Actif":"Désactivé",p.actif?"":"a"),`<button class="b" data-a="ac" data-v="${p.id}|${p.actif?0:1}">${p.actif?"Désactiver":"Réactiver"}</button>`]))}</div><div class="card"><h2>Attribuer un rôle</h2><p class="sub">Créez d’abord le compte dans Supabase (Authentication > Add user), puis saisissez ici son email.</p><div class="g2"><div><label>Email du compte</label><input id="ae" type="email"></div><div><label>Nom affiché</label><input id="an"></div><div><label>Rôle</label><select id="ar">${Object.entries(ROLES).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select></div></div><button class="b p" data-a="at">Enregistrer</button></div>`},
